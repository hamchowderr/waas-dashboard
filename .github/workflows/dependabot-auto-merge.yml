# Dependabot's minor and patch updates merge on their own once the required
# checks pass. Major updates stay open for a person to look at.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    timeout-minutes: 90
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update's details
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge minor and patch updates once the required checks pass
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          sleep 60
          gh pr checks "$PR_URL" --required --watch --fail-fast --interval 30
          gh pr merge "$PR_URL" --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
