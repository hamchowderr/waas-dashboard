name: Delete merged branches

# Branches pile up otherwise: every pull request leaves its branch behind. A merged pull request's branch is deleted
# as soon as it merges, and once a week (or by hand) every branch whose work is finished goes too: one with no open
# pull request whose newest commit is the head of a merged or closed one. A branch with commits no pull request has
# seen, or with an open pull request, is never touched.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  merged:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" --jq length)
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)
          if [ "$open" = "0" ] && [ "$tip" = "$SHA" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" && echo "Deleted $BRANCH"
          else
            echo "Kept $BRANCH (open pull requests: $open, tip $tip, merged $SHA)"
          fi

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose work is finished
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" \
            --jq ".[] | select(.head.repo.full_name == \"$GITHUB_REPOSITORY\") | [.head.ref, .head.sha, .state] | @tsv" > prs.tsv
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | [.name, .commit.sha, .protected] | @tsv' > branches.tsv
          deleted=0
          while IFS=$'\t' read -r name sha protected; do
            [ "$name" = "$DEFAULT" ] || [ "$protected" = "true" ] && continue
            awk -F'\t' -v b="$name" '$1 == b && $3 == "open"' prs.tsv | grep -q . && continue
            awk -F'\t' -v b="$name" -v s="$sha" '$1 == b && $2 == s && $3 == "closed"' prs.tsv | grep -q . || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name" && deleted=$((deleted + 1)) && echo "Deleted $name"
          done < branches.tsv
          echo "Deleted $deleted branches"
