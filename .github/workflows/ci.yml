name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Update pins workflow starts CI on its pull request's branch this way.
  workflow_dispatch:

jobs:
  pins:
    # Fails when a pinned version (.github/pins.json) is behind an AnyPress release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hamchowderr/waas-provisioning-api/.github/pins@main
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so `fallow audit` can compare with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run prices:check
      # Fallow (.fallowrc.json): unused files, exports, types and packages fail every run; on a pull request, new
      # duplicated or overly complex code fails too.
      - run: npm run deadcode
      - if: github.event_name == 'pull_request'
        run: npx fallow audit --base origin/${{ github.base_ref }}
      - run: npm test
      - run: npm run build
